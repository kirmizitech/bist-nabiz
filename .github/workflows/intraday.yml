name: Seans ici anlik goruntu

on:
  schedule:
    # GitHub Actions cron UTC calisir; Turkiye UTC+3 (yaz saati yok): 10:02-18:32 TR = 07:02-15:32 UTC
    - cron: "2,32 7-15 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/intraday.yml"

permissions:
  contents: write

concurrency:
  group: intraday
  cancel-in-progress: false

jobs:
  intraday:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seans ici veriyi cek
        run: |
          python3 - <<'PY' | tee data/intraday-log.txt
          import json, os, time, urllib.request
          from datetime import datetime, timezone, timedelta

          UA = {"User-Agent": "Mozilla/5.0 (compatible; bist-nabiz/1.0)"}
          TR = timezone(timedelta(hours=3))


          def tickers():
              for path, key in (("tickers.json", None), ("data/latest.json", "rows")):
                  try:
                      with open(path, encoding="utf-8") as fh:
                          d = json.load(fh)
                      if key:
                          return [r["ticker"] for r in d.get(key, [])]
                      for k in ("bist100", "BIST100", "bist_100"):
                          if isinstance(d.get(k), list) and d[k]:
                              return list(d[k])
                      if isinstance(d, list):
                          return list(d)
                  except Exception:
                      continue
              return []


          def parse_chart(payload, bugun):
              """Yahoo v8 chart cevabindan bugunun 15 dakikalik barlarini cikar."""
              r = payload["chart"]["result"][0]
              meta = r.get("meta") or {}
              ts = r.get("timestamp") or []
              q = (r["indicators"]["quote"][0]) if r.get("indicators", {}).get("quote") else {}
              bars = []
              for i, x in enumerate(ts):
                  c = (q.get("close") or [None] * len(ts))[i]
                  if c is None:
                      continue
                  t = datetime.fromtimestamp(x, TR)
                  if t.strftime("%Y-%m-%d") != bugun:
                      continue
                  bars.append({
                      "t": t.strftime("%H:%M"),
                      "c": float(c),
                      "h": float((q.get("high") or [c] * len(ts))[i] or c),
                      "l": float((q.get("low") or [c] * len(ts))[i] or c),
                      "o": float((q.get("open") or [c] * len(ts))[i] or c),
                      "v": float((q.get("volume") or [0] * len(ts))[i] or 0),
                  })
              prev = meta.get("chartPreviousClose") or meta.get("previousClose")
              return bars, (float(prev) if prev else None), meta


          def fetch_intraday(t, bugun):
              last = None
              for host in ("query1.finance.yahoo.com", "query2.finance.yahoo.com"):
                  try:
                      url = ("https://" + host + "/v8/finance/chart/" + t +
                             ".IS?range=1d&interval=15m")
                      req = urllib.request.Request(url, headers=UA)
                      d = json.loads(urllib.request.urlopen(req, timeout=20).read())
                      return parse_chart(d, bugun)
                  except Exception as e:
                      last = e
              raise RuntimeError(str(last))


          def row_for(t, bars, prev):
              if not bars:
                  return None
              son = bars[-1]
              hi = max(b["h"] for b in bars)
              lo = min(b["l"] for b in bars)
              vol = sum(b["v"] for b in bars)
              chg = round((son["c"] / prev - 1) * 100, 2) if prev else None
              return {"ticker": t, "son": round(son["c"], 4), "zaman": son["t"],
                      "acilis": round(bars[0]["o"], 4), "yuksek": round(hi, 4), "dusuk": round(lo, 4),
                      "hacim": round(vol, 0), "gunDegisim": chg,
                      "oncekiKapanis": round(prev, 4) if prev else None, "bar": len(bars)}


          def run():
              ts = tickers()
              if not ts:
                  print("ticker listesi bulunamadi")
                  return
              simdi = datetime.now(TR)
              bugun = simdi.strftime("%Y-%m-%d")
              if simdi.weekday() >= 5:
                  print("hafta sonu, seans yok")
                  return
              rows, fails = [], []
              for t in ts:
                  try:
                      bars, prev, meta = fetch_intraday(t, bugun)
                      r = row_for(t, bars, prev)
                      if r:
                          rows.append(r)
                  except Exception as e:
                      fails.append("%s (%s)" % (t, str(e)[:60]))
                  time.sleep(0.2)
              print("seans ici veri alinan: %d / %d" % (len(rows), len(ts)))
              if fails:
                  print("alinamayan: " + ", ".join(fails[:10]))
              if len(rows) < 20:
                  print("bugun icin yeterli bar yok (tatil ya da seans baslamadi); dosya yazilmadi")
                  return
              chg = [r["gunDegisim"] for r in rows if r["gunDegisim"] is not None]
              chg.sort()
              ort = chg[len(chg) // 2] if chg else None
              up = sorted((r for r in rows if r["gunDegisim"] is not None),
                          key=lambda r: -r["gunDegisim"])
              out = {
                  "asof": bugun,
                  "updatedAt": simdi.isoformat(timespec="seconds"),
                  "saat": simdi.strftime("%H:%M"),
                  "gecikme": "Yahoo Finance seans ici verisi, yaklasik 15 dakika gecikmeli",
                  "kapsam": len(rows),
                  "ortancaDegisim": ort,
                  "enCokArtan": [{"ticker": r["ticker"], "degisim": r["gunDegisim"]} for r in up[:5]],
                  "enCokDusen": [{"ticker": r["ticker"], "degisim": r["gunDegisim"]} for r in up[-5:][::-1]],
                  "rows": rows,
              }
              os.makedirs("data", exist_ok=True)
              with open("data/intraday.json", "w", encoding="utf-8") as fh:
                  json.dump(out, fh, ensure_ascii=False, separators=(",", ":"))
              print("intraday.json yazildi: %s %s, ortanca gun %s%%, kapsam %d"
                    % (bugun, out["saat"], ort, len(rows)))
              print("en cok artan: " + ", ".join("%s %+0.2f%%" % (x["ticker"], x["degisim"])
                                                 for x in out["enCokArtan"]))
              print("en cok dusen: " + ", ".join("%s %+0.2f%%" % (x["ticker"], x["degisim"])
                                                 for x in out["enCokDusen"]))


          run()

          PY

      - name: Depoya yaz
        run: |
          if [ ! -f data/intraday.json ]; then echo "dosya yok, commit atlaniyor"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/intraday.json data/intraday-log.txt
          if git diff --staged --quiet; then
            echo "degisiklik yok"
          else
            git commit -m "seans ici: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash || true
            git push
          fi
